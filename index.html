<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Domain Sales Tracker</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        input[type="text"] {
            padding: 10px;
            width: 100%;
            max-width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .filters {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        button.filter-btn {
            padding: 8px 15px;
            border: 1px solid #3498db;
            background-color: #fff;
            color: #3498db;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        button.filter-btn.active, button.filter-btn:hover {
            background-color: #3498db;
            color: #fff;
        }
        .count-info {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fa;
            color: #2c3e50;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 11px;
            color: #fff;
            background-color: #7f8c8d;
        }
        .Sedo { background-color: #e74c3c; }
        .Afternic { background-color: #3498db; }
        .Atom { background-color: #9b59b6; }
        .Spaceship { background-color: #e67e22; }
    </style>
</head>
<body>

<div class="container">
    <h1>Live Domain Sales Tracker</h1>
    
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search domain..." onkeyup="filterTable()">
        <div class="filters">
            <button class="filter-btn active" onclick="filterVenue('All', this)">All</button>
            <button class="filter-btn" onclick="filterVenue('Sedo', this)">Sedo</button>
            <button class="filter-btn" onclick="filterVenue('Afternic', this)">Afternic</button>
            <button class="filter-btn" onclick="filterVenue('Atom', this)">Atom</button>
            <button class="filter-btn" onclick="filterVenue('Spaceship', this)">Spaceship</button>
        </div>
    </div>

    <div class="count-info" id="countInfo">Showing up to 100 sales</div>

    <table id="salesTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Domain Name</th>
                <th>Price</th>
                <th>Venue</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data will be loaded automatically -->
        </tbody>
    </table>
</div>

<script>
    let allSalesData = [];
    let currentVenue = 'All';

    // Fetch data from sales.json
    fetch('sales.json')
        .then(response => response.json())
        .then(data => {
            allSalesData = data;
            filterTable();
        })
        .catch(error => console.error('Error loading data:', error));

    function displayTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        // تحديد عرض أول 100 صفقة فقط في الصفحة
        const limitedData = data.slice(0, 100);

        document.getElementById('countInfo').innerText = `Showing ${limitedData.length} of ${data.length} sales`;

        if (limitedData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No matching records found</td></tr>';
            return;
        }

        limitedData.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${item.domain}</strong></td>
                <td><span style="color: #27ae60; font-weight: bold;">${item.price}</span></td>
                <td><span class="badge ${item.venue}">${item.venue}</span></td>
                <td>${item.date}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allSalesData.filter(item => {
            const matchesSearch = item.domain.toLowerCase().includes(query);
            const matchesVenue = currentVenue === 'All' || item.venue === currentVenue;
            return matchesSearch && matchesVenue;
        });
        displayTable(filtered);
    }

    function filterVenue(venue, btn) {
        currentVenue = venue;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterTable();
    }
</script>

</body>
</html>
