<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Sales Tracker - تتبع مبيعات الدومينات</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #ffffff;
        }
        .highlight {
            color: #10b981;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1f2937;
            border-radius: 8px;
            overflow: hidden;
            text-align: right;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #374151;
        }
        th {
            background: #111827;
            color: #9ca3af;
            font-size: 14px;
        }
        .domain-name {
            color: #34d399;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>تتبع مبيعات الدومينات <span class="highlight">Tracker</span></h1>
        <p>أرشيف مبيعات الدومينات الحية لجميع الامتدادات</p>
    </header>

    <table>
        <thead>
            <tr>
                <th>اسم الدومين</th>
                <th>الامتداد (TLD)</th>
                <th>الثمن (USD)</th>
                <th>المنصة</th>
                <th>التاريخ</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="domain-name">ai.com</td>
                <td>.com</td>
                <td>$11,000,000</td>
                <td>Private</td>
                <td>2026-05-12</td>
            </tr>
            <tr>
                <td class="domain-name">code.ai</td>
                <td>.ai</td>
                <td>$150,000</td>
                <td>Sedo</td>
                <td>2026-06-01</td>
            </tr>
            <tr>
                <td class="domain-name">cloud.io</td>
                <td>.io</td>
                <td>$85,000</td>
                <td>Afternic</td>
                <td>2026-06-15</td>
            </tr>
            <tr>
                <td class="domain-name">shop.ma</td>
                <td>.ma</td>
                <td>$12,000</td>
                <td>Direct</td>
                <td>2026-06-20</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
